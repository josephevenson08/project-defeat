<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Defeat · Paperdoll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink-0:#0d0b09;      /* page */
  --ink-1:#17130f;      /* panel */
  --ink-2:#211b15;      /* slot well */
  --ink-3:#2c241c;      /* raised */
  --bronze-1:#5a4630;   /* frame shadow edge */
  --bronze-2:#8a6d45;   /* frame */
  --bronze-3:#c9a66b;   /* frame highlight / accent */
  --parch:#ece2cf;      /* body text */
  --parch-dim:#b3a68f;  /* secondary text */
  --q-epic:#b45cff;     /* epic, lifted from #a335ee for AA on near-black */
  --q-epic-edge:#a335ee;
  --q-green:#1eff00;
  --warn:#e8a33c;
  --gold:#ffd27a;
  --focus:#ffe08a;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.25rem; --t-xl:1.6rem; --t-2xl:2.1rem;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink-0) radial-gradient(ellipse at 50% -10%,#2a1f14 0%,var(--ink-0) 60%) fixed;
  color:var(--parch);font:400 var(--t-md)/1.5 var(--f-body);min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.04em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.dirline{font-size:var(--t-xs);color:var(--parch-dim);padding:8px 0;border-bottom:1px solid var(--bronze-1)}
.dirline b{color:var(--bronze-3);font-weight:500}

/* ornate frame: layered borders + corner studs */
.frame{position:relative;background:linear-gradient(180deg,var(--ink-1),#120f0c);
  border:1px solid var(--bronze-1);
  box-shadow:inset 0 0 0 3px var(--ink-0),inset 0 0 0 4px var(--bronze-2),inset 0 0 0 6px var(--ink-0),inset 0 0 0 7px var(--bronze-1),0 8px 30px rgba(0,0,0,.55);
  padding:22px}
.frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;
  background:radial-gradient(circle,var(--bronze-3) 0 2px,transparent 3px),linear-gradient(45deg,transparent 45%,var(--bronze-2) 46% 54%,transparent 55%);
  border:1px solid var(--bronze-2);transform:rotate(45deg);background-color:var(--ink-0)}
.frame::before{top:-7px;left:-7px}.frame::after{bottom:-7px;right:-7px}
.title-bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--bronze-1);padding-bottom:10px;margin-bottom:16px}
.title-bar h2{font-size:var(--t-xl);color:var(--bronze-3)}
.prov{font-size:var(--t-xs);color:var(--parch-dim)}

/* top nav */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0}
.brand{font-family:var(--f-display);font-size:var(--t-xl);color:var(--gold);letter-spacing:.08em}
.brand small{display:block;font-family:var(--f-body);font-size:var(--t-xs);color:var(--parch-dim);letter-spacing:.02em}
nav.sections{display:flex;flex-wrap:wrap;gap:4px}
.navbtn,.subtab{background:var(--ink-2);border:1px solid var(--bronze-1);padding:8px 12px;cursor:pointer;
  font-family:var(--f-display);font-size:var(--t-sm);letter-spacing:.05em;color:var(--parch-dim);min-height:40px}
.navbtn[aria-selected="true"],.subtab[aria-selected="true"]{color:var(--gold);border-color:var(--bronze-3);
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));box-shadow:inset 0 -2px 0 var(--bronze-3)}
.navbtn:hover,.subtab:hover{color:var(--parch)}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px}

/* character sheet */
.sheet{display:grid;grid-template-columns:minmax(200px,1fr) minmax(220px,1.1fr) minmax(200px,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px}
.bottom{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,220px));justify-content:center;gap:8px}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--ink-2);border:1px solid var(--bronze-1);padding:6px 8px;min-height:52px}
.slot:hover,.slot[aria-expanded="true"]{border-color:var(--bronze-3);background:var(--ink-3)}
.col.right .slot{flex-direction:row-reverse;text-align:right}
.glyph{flex:none;width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-display);font-size:var(--t-sm);
  color:var(--q-epic);background:radial-gradient(circle at 35% 30%,#3a2350,#160d1f);
  border:2px solid var(--q-epic-edge);box-shadow:inset 0 0 0 1px #000,0 0 8px rgba(163,53,238,.35)}
.slot .meta{min-width:0;display:flex;flex-direction:column}
.slot .lbl{font-size:var(--t-xs);color:var(--parch-dim);text-transform:uppercase;letter-spacing:.08em}
.slot .nm{color:var(--q-epic);font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.slot .en{font-size:var(--t-xs);color:#5fdc4a;line-height:1.25}
.figure{display:flex;flex-direction:column;align-items:center;gap:10px}
.figure svg{width:100%;max-width:260px;height:auto}
.who{text-align:center}
.who h3{font-size:var(--t-lg);color:var(--parch)}
.who p{margin:0;font-size:var(--t-sm);color:var(--parch-dim)}
.setbadge{font-size:var(--t-sm);color:var(--q-green);border:1px solid #2f5a22;background:#0f1a0b;padding:2px 10px}

/* tooltip card */
.tip{position:absolute;z-index:10;width:290px;max-width:calc(100vw - 32px);pointer-events:none;
  background:rgba(10,8,14,.97);border:1px solid #6b6b80;outline:1px solid #000;
  box-shadow:inset 0 0 0 1px #1d1a26,0 10px 28px rgba(0,0,0,.7);padding:10px 12px;font-size:var(--t-sm);line-height:1.4}
.tip .t-name{font-size:var(--t-md);font-weight:700;color:var(--q-epic)}
.tip .t-sub{color:var(--parch)}
.tip .t-ench{color:var(--q-green)}
.tip .t-set{color:var(--gold);margin-top:6px}
.tip .t-src{color:var(--parch-dim);margin-top:6px;border-top:1px solid #2a2733;padding-top:6px}

/* stats */
.stats{margin-top:22px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px dotted var(--bronze-1)}
.stat dt{color:var(--parch-dim)}
.stat dd{margin:0;font-variant-numeric:tabular-nums lining-nums;font-weight:700;color:var(--parch)}
.capnote{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--warn);background:#1e160c;font-size:var(--t-sm)}
.capnote strong{color:var(--warn)}
.panel-sketch p{color:var(--parch-dim);max-width:60ch}
.panel-sketch b{color:var(--parch)}
.ep{color:var(--q-epic);font-weight:500}
.tiers{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tiers li{display:flex;gap:12px;align-items:baseline;padding:8px 10px;background:var(--ink-2);border:1px solid var(--bronze-1);color:var(--parch-dim)}
.tier{flex:none;width:30px;height:30px;display:grid;place-items:center;font-family:var(--f-display);color:var(--gold)!important;border:1px solid var(--bronze-3);background:var(--ink-3)}
footer{padding:24px 0 32px;font-size:var(--t-xs);color:var(--parch-dim)}

@media (max-width:820px){
  .sheet{grid-template-columns:1fr 1fr;gap:8px}
  .figure{grid-column:1/-1;order:-1}
  .figure svg{display:none}
  .col{display:contents}
  .col.right .slot{flex-direction:row;text-align:left}
  .bottom{grid-template-columns:1fr 1fr;justify-content:stretch}
  .frame{padding:18px 14px}
}
@media (max-width:480px){
  .statgrid{grid-template-columns:1fr}
  .slot{gap:8px;padding:6px}
  .glyph{width:32px;height:32px;font-size:var(--t-xs)}
  .slot .nm{font-size:var(--t-sm)}
}
@media (prefers-reduced-motion:no-preference){
  .slot,.navbtn,.subtab{transition:border-color .15s,background-color .15s}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="dirline"><b>Direction 07 · Paperdoll</b> — after the in-game character pane and Path of Exile 2's ornate framing (research T7, T8, T15, R3). Prototype only, not the live app.</p>

  <header class="top">
    <div class="brand">Project Defeat<small>TBC Classic Anniversary · Phase 2</small></div>
    <nav class="sections" role="tablist" aria-label="Sections" id="nav"></nav>
  </header>

  <main id="sections"></main>

  <footer>Data: Wowhead · Phase 2 · updated 12 Sep. Icons are slot initials; no game art is used.</footer>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>

<script>
const GEAR = [
 {s:"head",l:"Head",n:"Destroyer Battle-Helm",e:"Glyph of Ferocity",src:"T5 token · Lady Vashj, Serpentshrine Cavern",set:1,col:"L"},
 {s:"neck",l:"Neck",n:"Pendant of the Perilous",src:"Serpentshrine Cavern trash",col:"L"},
 {s:"shoulder",l:"Shoulders",n:"Destroyer Shoulderblades",e:"Might of the Scourge",src:"T5 token · Void Reaver, Tempest Keep",set:1,col:"L"},
 {s:"back",l:"Back",n:"Black-Iron Battlecloak",e:"Greater Agility",col:"L"},
 {s:"chest",l:"Chest",n:"Destroyer Breastplate",e:"Exceptional Stats",src:"T5 token · Kael'thas Sunstrider, Tempest Keep",set:1,col:"L"},
 {s:"wrist",l:"Wrists",n:"Bracers of Eradication",e:"Brawn",col:"L"},
 {s:"hands",l:"Hands",n:"Destroyer Gauntlets",e:"Major Strength",src:"T5 token · Leotheras the Blind, Serpentshrine Cavern",set:1,col:"R"},
 {s:"waist",l:"Waist",n:"Belt of One-Hundred Deaths",col:"R"},
 {s:"legs",l:"Legs",n:"Leggings of Murderous Intent",e:"Nethercobra Leg Armor",col:"R"},
 {s:"feet",l:"Feet",n:"Warboots of Obliteration",e:"Cat's Swiftness",col:"R"},
 {s:"f1",l:"Finger 1",n:"Band of the Ranger-General",src:"Kael'thas Sunstrider, Tempest Keep",col:"R"},
 {s:"f2",l:"Finger 2",n:"Ring of Reciprocity",col:"R"},
 {s:"t1",l:"Trinket 1",n:"Dragonspine Trophy",src:"Gruul the Dragonkiller, Gruul's Lair",col:"R"},
 {s:"t2",l:"Trinket 2",n:"Badge of the Swarmguard",col:"R"},
 {s:"mh",l:"Main Hand",n:"Dragonstrike",e:"Mongoose",col:"B"},
 {s:"oh",l:"Off Hand",n:"Talon of Azshara",e:"Mongoose",col:"B"},
 {s:"ranged",l:"Ranged",n:"Serpent Spine Longbow",e:"Khorium Scope",col:"B"}
];
const SECTIONS = ["Character Planner","Simulation","Raid Composition","Spec Tier Lists","Raids","Professions"];
const SUBTABS = ["Gear","Compare","Talents","Buffs","Ranked Gear","Build"];
const initials = l => l.replace(/[^A-Z0-9]/g,"").slice(0,2) || l.slice(0,2);
const slotBtn = g => `<button class="slot" type="button" data-slot="${g.s}" aria-expanded="false" aria-describedby="tip">
  <span class="glyph" aria-hidden="true">${initials(g.l)}</span>
  <span class="meta"><span class="lbl">${g.l}</span><span class="nm">${g.n}</span>${g.e?`<span class="en">${g.e}</span>`:""}</span></button>`;

const FIGURE = `<svg viewBox="0 0 240 360" role="img" aria-label="Stylized warrior silhouette">
 <defs>
  <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a28"/><stop offset="1" stop-color="#1c150f"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#a335ee" stop-opacity=".22"/><stop offset="1" stop-color="#a335ee" stop-opacity="0"/></radialGradient>
 </defs>
 <ellipse cx="120" cy="160" rx="118" ry="170" fill="url(#halo)"/>
 <g fill="url(#fg)" stroke="#c9a66b" stroke-width="1.2" stroke-linejoin="round">
  <path d="M120 22c-15 0-25 11-25 27 0 9 3 16 8 21l-2 10h38l-2-10c5-5 8-12 8-21 0-16-10-27-25-27z"/>
  <path d="M96 52h48M108 40l12-14 12 14" fill="none"/>
  <path d="M78 92c10-10 28-14 42-14s32 4 42 14l18 6 8 18-14 10-10-6-2 40 6 34H72l6-34-2-40-10 6-14-10 8-18z"/>
  <path d="M84 196h72l4 12H80z"/>
  <path d="M82 208h34l-4 70 2 52H90l-4-52zM124 208h34l-4 70-4 52h-24l2-52z"/>
  <path d="M54 126l-12 64 10 30 14-4-4-28 10-50zM186 126l12 64-10 30-14-4 4-28-10-50z"/>
  <path d="M86 330h28v12H80zM126 330h28l6 12h-34z"/>
 </g>
 <g stroke="#c9a66b" stroke-width="1.4" fill="none">
  <path d="M46 222l-24 96M40 226l14 6"/><path d="M194 222l26 92M200 226l-14 6"/>
  <path d="M120 100v60M100 120h40" stroke-opacity=".5"/>
 </g>
</svg>`;

const plannerHTML = () => {
  const L = GEAR.filter(g=>g.col==="L").map(slotBtn).join("");
  const R = GEAR.filter(g=>g.col==="R").map(slotBtn).join("");
  const B = GEAR.filter(g=>g.col==="B").map(slotBtn).join("");
  return `<div class="subtabs" role="tablist" aria-label="Planner">${SUBTABS.map((t,i)=>
    `<button class="subtab" role="tab" type="button" aria-selected="${i===0}" data-sub="${i}">${t}</button>`).join("")}</div>
  <div data-subpanel="0">
   <div class="sheet">
    <div class="col left">${L}</div>
    <div class="figure">${FIGURE}
     <div class="who"><h3>Human Fury Warrior</h3><p>Level 70 · Alliance · Phase 2 set</p></div>
     <span class="setbadge">Destroyer Battlegear (4/5)</span>
    </div>
    <div class="col right">${R}</div>
    <div class="bottom">${B}</div>
   </div>
   <section class="stats" aria-labelledby="stat-h">
    <div class="title-bar"><h2 id="stat-h" style="font-size:var(--t-lg)">Character Stats</h2><span class="prov">Melee · vs. level 73 boss</span></div>
    <dl class="statgrid">
     <div class="stat"><dt>Attack Power</dt><dd>1,788</dd></div>
     <div class="stat"><dt>Crit Rating</dt><dd>536</dd></div>
     <div class="stat"><dt>Hit Rating</dt><dd>140 <span style="color:var(--warn);font-weight:400">/ 142</span></dd></div>
     <div class="stat"><dt>Haste Rating</dt><dd>163</dd></div>
     <div class="stat"><dt>Expertise</dt><dd>64</dd></div>
     <div class="stat"><dt>Armor Penetration</dt><dd>0</dd></div>
    </dl>
    <p class="capnote"><strong>2 rating under the hit cap.</strong> A dual-wielder's special attacks cap at 142 hit rating (9%) in TBC. You have 140.</p>
   </section>
  </div>
  ${SUBTABS.slice(1).map((t,i)=>`<div data-subpanel="${i+1}" hidden class="panel-sketch"><p>${t} — sketched panel. In this direction it would reuse the same framed slot cards and tooltip.</p></div>`).join("")}`;
};

const PANELS = [
  plannerHTML,
  () => `<p>Estimated DPS against a fixed target: <b>level 73 boss, 7,700 armor</b>. Results would sit in a framed scroll beside the paperdoll.</p>`,
  () => `<p>Seat 10 or 25 players into groups of five and see which buffs each group receives.</p>`,
  () => `<ul class="tiers">
     <li><b class="tier">S</b> Arcane Mage, Destruction Warlock, Beast Mastery Hunter, Fury Warrior</li>
     <li><b class="tier">A</b> Arms Warrior, Enhancement Shaman, Affliction Warlock, Survival Hunter</li>
     <li><b class="tier">B</b> Retribution Paladin, Combat Rogue, Shadow Priest, Elemental Shaman, Balance Druid, Fire Mage</li></ul>`,
  () => `<p>Phase 1: Karazhan, Gruul's Lair, Magtheridon's Lair · Phase 2: Serpentshrine Cavern, Tempest Keep.</p>
     <p><b>Attumen the Huntsman</b> — <span class="ep">Steelhawk Crossbow</span>, <span class="ep">Worgen Claw Necklace</span>, <span class="ep">Gloves of Saintly Blessings</span><br>
     <b>Moroes</b> — <span class="ep">Emerald Ripper</span>, <span class="ep">Brooch of Unquenchable Fury</span>, <span class="ep">Royal Cloak of Arathi Kings</span><br>
     <b>Vendor</b> — <span class="ep">Necklace of Eternal Hope</span>, 25× Badge of Justice</p>`,
  () => `<p>Levelling guides 1–375 and farming maps. Mining example: <b>Fel Iron Deposit</b>, skill 300 — Hellfire Peninsula, Zangarmarsh, Shadowmoon Valley.</p>`
];

const nav = document.getElementById("nav"), main = document.getElementById("sections");
SECTIONS.forEach((name,i)=>{
  nav.insertAdjacentHTML("beforeend",`<button class="navbtn" role="tab" type="button" id="tab-${i}" aria-controls="sec-${i}" aria-selected="${i===0}">${name}</button>`);
  main.insertAdjacentHTML("beforeend",`<section class="frame${i?" panel-sketch":""}" id="sec-${i}" role="tabpanel" aria-labelledby="tab-${i}" ${i?"hidden":""}>
    <div class="title-bar"><h2>${name}</h2><span class="prov">Wowhead · Phase 2 · updated 12 Sep</span></div>${PANELS[i]()}</section>`);
});
nav.addEventListener("click",e=>{
  const b = e.target.closest(".navbtn"); if(!b) return;
  hideTip();
  nav.querySelectorAll(".navbtn").forEach((x,i)=>{const on=x===b;x.setAttribute("aria-selected",on);document.getElementById("sec-"+i).hidden=!on;});
});
main.addEventListener("click",e=>{
  const b = e.target.closest(".subtab"); if(!b) return;
  main.querySelectorAll(".subtab").forEach(x=>x.setAttribute("aria-selected",x===b));
  main.querySelectorAll("[data-subpanel]").forEach(p=>p.hidden=p.dataset.subpanel!==b.dataset.sub);
});

/* tooltip */
const tip = document.getElementById("tip");
let pinned = null;
function showTip(btn){
  const g = GEAR.find(x=>x.s===btn.dataset.slot);
  tip.innerHTML = `<div class="t-name">${g.n}</div><div class="t-sub">${g.l} · Epic</div>`
    + (g.e?`<div class="t-ench">Enchanted: ${g.e}</div>`:"")
    + (g.set?`<div class="t-set">Destroyer Battlegear (4/5)</div>`:"")
    + `<div class="t-src">${g.src?"Source: "+g.src:"Source in guide"}</div>`;
  tip.hidden = false;
  main.querySelectorAll(".slot").forEach(s=>s.setAttribute("aria-expanded",s===btn));
  const r = btn.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const vw = document.documentElement.clientWidth;
  let x = r.right + 10;
  if (x + w > vw - 16) x = r.left - w - 10;
  if (x < 16) x = Math.min(Math.max(16, r.left), vw - w - 16);
  let y = (x >= r.right || x + w <= r.left) ? r.top : r.bottom + 8;
  if (y + h > window.innerHeight - 8 && x < r.right && x + w > r.left) y = r.top - h - 8;
  tip.style.left = x + window.scrollX + "px";
  tip.style.top = Math.max(8, y) + window.scrollY + "px";
}
function hideTip(){ tip.hidden = true; pinned = null; main.querySelectorAll(".slot").forEach(s=>s.setAttribute("aria-expanded","false")); }
main.addEventListener("mouseover",e=>{const b=e.target.closest(".slot"); if(b && !pinned) showTip(b);});
main.addEventListener("mouseout",e=>{const b=e.target.closest(".slot"); if(b && !pinned && !b.contains(e.relatedTarget)) hideTip();});
main.addEventListener("focusin",e=>{const b=e.target.closest(".slot"); if(b) showTip(b);});
main.addEventListener("focusout",e=>{if(e.target.closest(".slot") && !pinned) hideTip();});
main.addEventListener("click",e=>{
  const b = e.target.closest(".slot"); if(!b) return;
  if (pinned === b) { hideTip(); return; }
  showTip(b); pinned = b;
});
document.addEventListener("click",e=>{ if(pinned && !e.target.closest(".slot")) hideTip(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideTip(); });
window.addEventListener("resize",()=>{ if(!tip.hidden) hideTip(); });
</script>
</body>
</html>
