<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Defeat · TBC Classic Phase 2 planner</title>
    <meta
      name="description"
      content="A gear, talent and raid planner for World of Warcraft: The Burning Crusade Classic (Anniversary), Phase 2. Best-in-slot rankings, talents, DPS estimates, raid loot, tier lists and professions, all in your browser."
    />
    <meta name="theme-color" content="#03090d" />
    <!-- Link previews (Discord, Slack, social sites). The image URL has to be absolute, so it names
         the GitHub Pages address the app is deployed to. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Project Defeat" />
    <meta property="og:title" content="Project Defeat · TBC Classic Phase 2 planner" />
    <meta
      property="og:description"
      content="Gear, talents, DPS estimates, raid loot, tier lists and professions for TBC Classic Phase 2. Everything runs in your browser."
    />
    <meta property="og:url" content="https://josephevenson08.github.io/project-defeat/" />
    <meta property="og:image" content="https://josephevenson08.github.io/project-defeat/social-preview.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The two faces the first screen draws in, fetched alongside the script rather than after the
         stylesheet asks for them, so the loading screen's title does not flash in a fallback serif.
         `crossorigin` is required for a font preload even on the same origin. -->
    <link rel="preload" href="/fonts/marcellus-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree-variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
